# التشغيل الاحتياطي: يتأكد دوريًا أن التابلت يعمل؛ إذا غاب أكثر من 75 دقيقة يستلم الرصد من هنا،
# ويبقى شغّالًا (فحص عند :20 و:50) حتى يرجع التابلت — لأن GitHub لا يشغّل الجدول كل ساعة فعليًا (~5 مرات يوميًا).
# ذاكرة الاحتياطي تُحفظ بين التشغيلات (cache) حتى لا تتكرر رسائل الحالة، ورسالة الاستلام واحدة مجمّعة.
name: srca-backup
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}
concurrency: { group: srca-backup, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SRCA_RUNNER: backup
      SRCA_DATA: ${{ github.workspace }}/data
      SRCA_BACKUP_MINUTES: "330"
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}
      X_AUTH_TOKEN_2: ${{ secrets.X_AUTH_TOKEN_2 }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
      SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests feedparser google-play-scraper
      - id: gate
        run: python -m srca.main should-backup && echo "go=1" >> $GITHUB_OUTPUT || echo "go=0" >> $GITHUB_OUTPUT
      - if: steps.gate.outputs.go == '1'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: srca-bk-${{ github.run_id }}
          restore-keys: srca-bk-
      - if: steps.gate.outputs.go == '1'
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - if: steps.gate.outputs.go == '1'
        run: python -m srca.main backup-loop
      - if: always() && steps.gate.outputs.go == '1'
        uses: actions/cache/save@v4
        with:
          path: data
          key: srca-bk-${{ github.run_id }}-${{ github.run_attempt }}
